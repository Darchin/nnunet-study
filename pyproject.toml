[project]
name = "nnunetv2-study"
version = "2.8.1"
requires-python = ">=3.12"
description = "Research fork of the nnU-Net medical image segmentation framework."
readme = "readme.md"
license = { file = "LICENSE" }
authors = [
    { name = "Fabian Isensee", email = "f.isensee@dkfz-heidelberg.de" },
    { name = "Helmholtz Imaging Applied Computer Vision Lab" },
]
maintainers = [{ name = "Mehdi Rejali", email = "mehdi.rejali.2001@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
keywords = [
    'deep learning',
    'image segmentation',
    'semantic segmentation',
    'medical image analysis',
    'medical image segmentation',
    'nnU-Net',
    'nnunet',
]
dependencies = [
    "acvl-utils>=0.2.6,<0.3",                    # 0.3 may bring breaking changes. Careful!
    "dynamic-network-architectures>=0.4.4,<0.5",
    "tqdm",
    "scipy",
    "batchgenerators>=0.25.1",
    "numpy>=1.24",
    "scikit-learn",
    "scikit-image>=0.19.3",
    "SimpleITK>=2.2.1",
    "pandas",
    "graphviz",
    'tifffile',
    'requests',
    "nibabel",
    "matplotlib",
    "seaborn",
    "imagecodecs",
    "yacs",
    "batchgeneratorsv2>=0.3.2",
    "einops",
    "rich",
    "blosc2>=3.3.2",
    "timm>=1.0",                                 # required by nnssl finetuning (Primus); dynamic-network-architectures declares timm unpinned, which can resolve to a version predating timm.layers
    "torch>=2.12,<2.14",
    "triton>=3.7,<3.8; sys_platform != 'win32'",
    "triton-windows>=3.7; sys_platform == 'win32'",
]

[project.urls]
Repository = "https://github.com/Darchin/nnunet-study"
Upstream = "https://github.com/MIC-DKFZ/nnUNet"

[project.scripts]
plan_and_preprocess = "nnunetv2.experiment_planning.plan_and_preprocess_entrypoints:plan_and_preprocess_entry"
extract_fingerprint = "nnunetv2.experiment_planning.plan_and_preprocess_entrypoints:extract_fingerprint_entry"
plan_experiment = "nnunetv2.experiment_planning.plan_and_preprocess_entrypoints:plan_experiment_entry"
preprocess = "nnunetv2.experiment_planning.plan_and_preprocess_entrypoints:preprocess_entry"
benchmark = "nnunetv2.run.benchmark:benchmark_entry"
train = "nnunetv2.run.run_training:run_training_entry"
batch_train = "nnunetv2.run.batch_train:main"
predict_from_modelfolder = "nnunetv2.inference.predict_from_raw_data:predict_entry_point_modelfolder"
predict = "nnunetv2.inference.predict_from_raw_data:predict_entry_point"
convert_old_nnUNet_dataset = "nnunetv2.dataset_conversion.convert_raw_dataset_from_old_nnunet_format:convert_entry_point"
find_best_configuration = "nnunetv2.evaluation.find_best_configuration:find_best_configuration_entry_point"
determine_postprocessing = "nnunetv2.postprocessing.remove_connected_components:entry_point_determine_postprocessing_folder"
apply_postprocessing = "nnunetv2.postprocessing.remove_connected_components:entry_point_apply_postprocessing"
ensemble = "nnunetv2.ensembling.ensemble:entry_point_ensemble_folders"
accumulate_crossval_results = "nnunetv2.evaluation.find_best_configuration:accumulate_crossval_results_entry_point"
plot_overlay_pngs = "nnunetv2.utilities.overlay_plots:entry_point_generate_overlay"
download_pretrained_model_by_url = "nnunetv2.model_sharing.entry_points:download_by_url"
install_pretrained_model_from_zip = "nnunetv2.model_sharing.entry_points:install_from_zip_entry_point"
export_model_to_zip = "nnunetv2.model_sharing.entry_points:export_pretrained_model_entry"
move_plans_between_datasets = "nnunetv2.experiment_planning.plans_for_pretraining.move_plans_between_datasets:entry_point_move_plans_between_datasets"
evaluate_folder = "nnunetv2.evaluation.evaluate_predictions:evaluate_folder_entry_point"
evaluate_simple = "nnunetv2.evaluation.evaluate_predictions:evaluate_simple_entry_point"
convert_MSD_dataset = "nnunetv2.dataset_conversion.convert_MSD_dataset:entry_point"
preprocess_like_nnssl = "nnunetv2.experiment_planning.like_nnssl:preprocess_like_nnssl_entrypoint"
plan_like_dynamic = "nnunetv2.experiment_planning.like_nnssl:plan_like_dynamic_entrypoint"
train_pretrained = "nnunetv2.run.run_training_from_pretrained:train_pretrained_entrypoint"
report_results = "nnunetv2.run.report_results:report_results_entry"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[project.optional-dependencies]
dev = ["pre-commit"]

[tool.setuptools.packages.find]
include = ["nnunetv2*"]

[build-system]
requires = ["setuptools>=67.8.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["jupyter>=1.1.1", "torchinfo>=1.8.0"]

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "W"]
ignore = ["F403", "F405", "E501", "E741", "E722"]

[tool.codespell]
skip = '.git,*.pdf,*.svg'
ignore-words-list = 'LiTS,assertIn'
